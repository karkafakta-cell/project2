<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👾 NEON DISCORD SQUAD</title>
    <!-- Hubungkan ke Library Supabase -->
    <script src="https://jsdelivr.net"></script>
    <!-- Hubungkan ke File CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>👾 DISCORD SQUAD</h1>
        <p class="subtitle">Klik lingkaran foto profil untuk melihat database rahasia member.</p>

        <!-- Tempat Deretan Bulatan Foto Profil -->
        <div class="flex-squad" id="tempat-foto-squad">Memanggil anak-anak dari database...</div>

        <!-- Jendela Pop-Up Detail Member (Modal) -->
        <div class="modal-bg" id="bg-pop-up" onclick="tutupDetail()"></div>
        <div class="modal" id="pop-up-detail">
            <span class="close-btn" onclick="tutupDetail()">×</span>
            <div id="isi-detail-member"></div>
        </div>

        <!-- Formulir Tambah Member -->
        <div class="form-box">
            <h3 style="color:#45f3ff; margin-top:0;">✏️ Gabung Cyber Basecamp</h3>
            
            <div class="form-group">
                <label>Nama Member:</label>
                <input type="text" id="input_nama" placeholder="Masukkan nama panggilan...">
            </div>
            
            <div class="form-group">
                <label>Jabatan:</label>
                <select id="input_jabatan">
                    <option value="Member Biasa">Member Biasa</option>
                    <option value="Ketua Squad">Ketua Squad</option>
                    <option value="Sepuh Mabar">Sepuh Mabar</option>
                    <option value="Beban Team">Beban Team</option>
                    <option value="Camat (Cadangan Mati)">Camat (Cadangan Mati)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Gender:</label>
                <select id="input_gender">
                    <option value="Pria">Pria</option>
                    <option value="Wanita">Wanita</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Role Main Game:</label>
                <input type="text" id="input_role" placeholder="Contoh: Duelist, Core, Roamer...">
            </div>

            <div class="form-group">
                <label>Game Favorit (Bisa pilih lebih dari 1):</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="game" value="Valorant"> Valorant</label>
                    <label><input type="checkbox" name="game" value="MLBB"> MLBB</label>
                    <label><input type="checkbox" name="game" value="PUBG Mobile"> PUBG Mobile</label>
                    <label><input type="checkbox" name="game" value="Genshin Impact"> Genshin Impact</label>
                    <label><input type="checkbox" name="game" value="HSR"> Honkai: Star Rail</label>
                    <label><input type="checkbox" name="game" value="Minecraft"> Minecraft</label>
                </div>
            </div>

            <div class="form-group">
                <label>Status / Bio Ringkas:</label>
                <input type="text" id="input_bio" placeholder="Tulis bio mabar kalian...">
            </div>
            
            <div class="form-group">
                <label>Link Foto Profil (Opsional):</label>
                <input type="text" id="input_avatar" placeholder="Tempel link foto dari Discord/Pinterest...">
            </div>

            <button class="btn-kirim" onclick="kirimDataKeSupabase()">Daftar Squad 🚀</button>
        </div>
    </div>

    <!-- Hubungkan ke File JS Terpisah -->
    <script src="script.js"></script>
</body>
</html>
